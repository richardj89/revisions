name: Déploiement GitHub Pages

# Publie le jeu sur GitHub Pages à chaque mise à jour de la branche main.
# La première exécution active automatiquement Pages (enablement: true).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer le contenu du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
